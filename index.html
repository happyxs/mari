<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boa noite, minha Rapunzel 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@1&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-hearts" id="ambientHearts"></div>

<main class="scene" id="scene">
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="ground-line"></div>
  <div class="ground-glow" id="groundGlow"></div>

  <div class="tower-wrap" id="towerWrap">
    <div class="finial"><span class="flag"></span></div>
    <div class="tower-roof"></div>
    <div class="roof-trim"></div>

    <div class="hair" id="hair"></div>

    <div class="tower-body">
      <div class="window">
        <div class="hair-top"></div>
        <div class="rapunzel-shoulders"></div>
        <div class="rapunzel-head"></div>
      </div>
    </div>
  </div>

  <button class="prompt-btn" id="promptBtn">“Rapunzel, jogue seu cabelo!” 💛</button>

  <div class="burst-text" id="burstText">BOA NOITE</div>
</main>

<div class="explosion-layer" id="explosionLayer"></div>

<div class="finale-overlay" id="finaleOverlay">
  <div class="finale-card">
    <div class="finale-mini-heart">💛</div>
    <p class="finale-text" id="finaleText"></p>
    <p class="finale-sub">que seus sonhos sejam PERFEITOSSSSSSSS ASSIM COMO VOCÊ ✨</p>
    <button class="replay-btn" id="replayBtn">jogar o cabelo de novo</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
